<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Fractions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📗 Les fractions</h1>

<h2>🎯 Choisis ton niveau</h2>

<button onclick="setLevel('cm2')">🟢 CM2</button>
<button onclick="setLevel('sixieme')">🟡 6e</button>
<button onclick="setLevel('plus')">🔵 ++</button>

<hr>

<div class="lesson">
    <h2>📘 Leçon</h2>

    <p><b>Une fraction représente une partie d’un tout.</b></p>

    <ul>
        <li>🔢 Numérateur : parts prises</li>
        <li>🍰 Dénominateur : total des parts</li>
    </ul>

    <p>👉 Exemple : 3/4</p>
</div>

<hr>

<div class="quiz">
    <h2>🎯 Exercice</h2>

    <p id="question"></p>

    <button class="answerBtn" onclick="answer(0)"></button>
    <button class="answerBtn" onclick="answer(1)"></button>
    <button class="answerBtn" onclick="answer(2)"></button>

    <p id="result"></p>
    <p id="explanation"></p>
    <p id="score"></p>
</div>

<hr>

<h2>🍰 Mode Camembert</h2>

<p>Fais 3/4 :</p>

<div id="pie">
    <div class="slice" onclick="toggleSlice(0)"></div>
    <div class="slice" onclick="toggleSlice(1)"></div>
    <div class="slice" onclick="toggleSlice(2)"></div>
    <div class="slice" onclick="toggleSlice(3)"></div>
</div>

<button onclick="checkPie()">Valider</button>

<p id="pieResult"></p>

<script src="script.js"></script>
</body>
</html>
